ppo:
  algorithm: numpy_linear_ppo
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  batch_size: 256
  n_steps: 1024
  n_epochs: 4
  total_timesteps: 20000
  entropy_coef: 0.01
  max_grad_norm: 0.5
policy:
  observation: compact_state_vector
  action_space: insurance_sales_actions_v1
  action_masking: true
