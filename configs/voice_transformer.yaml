  min_confidence: 0.55
  max_audio_seconds: 30
tts:
  backend: windows_sapi
  voice: Microsoft Zira Desktop
  rate: 0
training:
  environment_version: voice_v3_transformer_explicit_stop
  observable_dialogue: true
  nlp_backend: transformer
