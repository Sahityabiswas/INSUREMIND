[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-sales-agent"
version = "0.2.0"
description = "Emotion- and intent-aware PPO research prototype for adaptive insurance sales dialogue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "gymnasium>=0.29",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
voice = ["vosk==0.3.45", "sounddevice>=0.5,<0.6", "text2num>=3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["src"]
